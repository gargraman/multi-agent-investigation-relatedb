[project]
name = "nexus-context-service"
version = "0.1.0"
description = "Nexus Context Service: the only gateway to the shared Relate graph."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "nexus-contracts",
    "nexus-shared",
    "pyyaml>=6",
    "relate-db==1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
nexus-contracts = { workspace = true }
nexus-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

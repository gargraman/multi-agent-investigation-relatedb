  # Context: SIGINT ev-sig-006 HDL-ALPHA-1 <-> HDL-BRAVO-1 (08:45Z) - a direct link, so no I4 path.
  expected_findings:
    - {agent: sigint-agent, kind: OBSERVATION, assertion: LINKED_TO, about: [HDL-ALPHA-1, HDL-BRAVO-1], evidence: [ev-sig-006]}
    - {agent: geoint-agent, kind: OBSERVATION, assertion: PLACED_AT, about: [ENT-ALPHA, LOC-GRID-02], evidence: [ev-geo-003]}
    - {agent: geoint-agent, kind: OBSERVATION, assertion: PLACED_AT, about: [ENT-ALPHA, LOC-GRID-21], evidence: [ev-geo-008]}
  corroborations: []
  contradictions:

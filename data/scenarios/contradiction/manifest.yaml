oracle:
  # Planted I3 conflict: two GEOINT sensors place ENT-ALPHA in non-neighbouring cells in
  # overlapping windows (distance sqrt(10) x pitch ~ 3.16 > 1.5 x pitch):
  #   ev-geo-003 (mast-north-11): ENT-ALPHA at LOC-GRID-02 [2026-10-20T08:00Z, 10:00Z)

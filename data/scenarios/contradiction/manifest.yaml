# Nexus scenario manifest (spec §11.3). SYNTHETIC: every name, handle, place and event is invented.
# Region: the fictional "Vellmark grid" (abstract cartesian units, not a real map).
# Evidence sha256 values are written by `uv run python scripts/gen_scenario.py`; do not hand-edit them.
# Which evidence items are generated noise is declared in generator.yaml (kept out of this file
# so evidence ids and fixtures carry no signal/noise hint).
scenario_id: contradiction
version: 1.0.0
synthetic: true
objective: >-
  Establish where the fictional subjects were during the supplied synthetic observation period,
  and report any conflicting observations without discarding either.
template:
  tasks:
    - agent: sigint-agent
      task_type: analyze_synthetic_communications
      token_share: 0.25
      input_refs: [ev-sig-001, ev-sig-002, ev-sig-003, ev-sig-004, ev-sig-005, ev-sig-006, ev-sig-007, ev-sig-008, ev-sig-009, ev-sig-010, ev-sig-011, ev-sig-012]

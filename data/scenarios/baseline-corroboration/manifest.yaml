# Nexus scenario manifest (spec §11.3). SYNTHETIC: every name, handle, place and event is invented.
# Region: the fictional "Vellmark grid" (abstract cartesian units, not a real map).
# Evidence sha256 values are written by `uv run python scripts/gen_scenario.py`; do not hand-edit them.
# Which evidence items are generated noise is declared in generator.yaml (kept out of this file
# so evidence ids and fixtures carry no signal/noise hint).
scenario_id: baseline-corroboration
version: 1.0.0
synthetic: true
objective: >-
  Identify recurring contact and co-location patterns among the fictional subjects in the supplied
  synthetic metadata, and assess whether any subjects are connected.
template:
  tasks:
    - agent: sigint-agent
      task_type: analyze_synthetic_communications
      token_share: 0.25
      input_refs: [ev-sig-001, ev-sig-002, ev-sig-003, ev-sig-004, ev-sig-005, ev-sig-006, ev-sig-007, ev-sig-008, ev-sig-009, ev-sig-010, ev-sig-011, ev-sig-012, ev-sig-013, ev-sig-014]
    - agent: geoint-agent
      task_type: analyze_synthetic_geospatial
      token_share: 0.25
      input_refs: [ev-geo-001, ev-geo-002, ev-geo-003, ev-geo-004, ev-geo-005, ev-geo-006, ev-geo-007, ev-geo-008, ev-geo-009, ev-geo-010, ev-geo-011, ev-geo-012, ev-geo-013, ev-geo-014, ev-geo-015]
    - agent: analysis-agent
      task_type: assess_findings
      token_share: 0.5
      input_refs: []
grid: {origin: {x: 0, y: 0}, pitch: 100, cols: 6, rows: 4}
entities:
  # People (codenames only; no real-world identity)
  - {id: ENT-ALPHA, type: PERSON, display_name: Subject ALPHA, aliases: [subject-alpha]}
  - {id: ENT-BRAVO, type: PERSON, display_name: Subject BRAVO, aliases: [subject-bravo]}
  - {id: ENT-CHARLIE, type: PERSON, display_name: Subject CHARLIE, aliases: [subject-charlie]}
  - {id: ENT-DELTA, type: PERSON, display_name: Subject DELTA, aliases: [subject-delta]}
  - {id: ENT-ECHO, type: PERSON, display_name: Subject ECHO, aliases: [subject-echo]}
  - {id: ENT-FOXTROT, type: PERSON, display_name: Subject FOXTROT, aliases: [subject-foxtrot]}
  # Handles: reserved .invalid domains (RFC 2606), never routable or real
  - {id: HDL-ALPHA-1, type: HANDLE, display_name: kestrel-7, aliases: [kestrel-7@relay.example.invalid], used_by: ENT-ALPHA}
  - {id: HDL-ALPHA-2, type: HANDLE, display_name: kestrel-alt, aliases: [kestrel-alt@mesh.example.invalid], used_by: ENT-ALPHA}
  - {id: HDL-BRAVO-1, type: HANDLE, display_name: osprey-9, aliases: [osprey-9@relay.example.invalid], used_by: ENT-BRAVO}
  - {id: HDL-CHARLIE-1, type: HANDLE, display_name: marten-3, aliases: [marten-3@relay.example.invalid], used_by: ENT-CHARLIE}
  - {id: HDL-DELTA-1, type: HANDLE, display_name: heron-5, aliases: [heron-5@mesh.example.invalid], used_by: ENT-DELTA}
  - {id: HDL-ECHO-1, type: HANDLE, display_name: lynx-2, aliases: [lynx-2@mesh.example.invalid], used_by: ENT-ECHO}
  - {id: HDL-FOXTROT-1, type: HANDLE, display_name: wren-8, aliases: [wren-8@relay.example.invalid], used_by: ENT-FOXTROT}
  - {id: HDL-UNATTRIB-1, type: HANDLE, display_name: stoat-0, aliases: [stoat-0@relay.example.invalid]}
  # Asset and organization (invented)
  - {id: AST-VAN-1, type: ASSET, display_name: Grey panel van (fictional), aliases: [vehicle-grey-van]}
  - {id: ORG-OBSIDIAN-LOOM, type: ORG, display_name: Obsidian Loom Collective (fictional), aliases: [obsidian-loom]}

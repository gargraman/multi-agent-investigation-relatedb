oracle:
  # Planted I4 pattern (ADR-007 G2/G4):
  #   HDL-ALPHA-1 USED_BY ENT-ALPHA, HDL-CHARLIE-1 USED_BY ENT-CHARLIE (manifest)
  #   SIGINT ev-sig-004: HDL-ALPHA-1 <-> HDL-CHARLIE-1, 4 contacts 2026-10-12..15 ~07:00Z
  #   GEOINT ev-geo-002: ENT-CHARLIE at LOC-GRID-14 [2026-10-14T09:00Z, 11:00Z)
  #   GEOINT ev-geo-007: ENT-BRAVO   at LOC-GRID-15 [2026-10-14T10:00Z, 12:00Z)  (neighbour, overlap 10:00-11:00)
  #   No direct ALPHA-BRAVO link: no manifest relation, no contact, no co-location (incl. noise).
  # Corroboration: SIGINT ev-sig-009 DELTA<->ECHO contact at 2026-10-16T13:40Z falls inside
  #   GEOINT ev-geo-011 co-location of DELTA and ECHO at LOC-GRID-04 [13:30Z, 14:30Z).
  expected_findings:
    - {agent: sigint-agent, kind: OBSERVATION, assertion: LINKED_TO, about: [HDL-ALPHA-1, HDL-CHARLIE-1], evidence: [ev-sig-004]}
    - {agent: sigint-agent, kind: OBSERVATION, assertion: LINKED_TO, about: [HDL-DELTA-1, HDL-ECHO-1], evidence: [ev-sig-009]}
    - {agent: geoint-agent, kind: OBSERVATION, assertion: PLACED_AT, about: [ENT-CHARLIE, LOC-GRID-14], evidence: [ev-geo-002]}
    - {agent: geoint-agent, kind: OBSERVATION, assertion: PLACED_AT, about: [ENT-BRAVO, LOC-GRID-15], evidence: [ev-geo-007]}
    - {agent: geoint-agent, kind: OBSERVATION, assertion: PLACED_AT, about: [ENT-DELTA, ENT-ECHO, LOC-GRID-04], evidence: [ev-geo-011]}
  corroborations:
    - {about: [ENT-DELTA, ENT-ECHO], evidence: [ev-sig-009, ev-geo-011], note: contact inside the co-location window}
  contradictions: []
  hidden_paths:
    - {a: ENT-ALPHA, via: ENT-CHARLIE, b: ENT-BRAVO}
  expected_denials: []
  canary_strings: []

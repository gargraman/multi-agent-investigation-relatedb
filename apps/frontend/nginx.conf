# Nexus frontend: static SPA + same-origin proxy to the orchestrator (spec §12.1, §16.1).
# Installed as an nginx *template*: ${NEXUS_API_UPSTREAM} and ${NGINX_RESOLVER} are filled by
# envsubst at container start (defaults set in the Dockerfile). nginx's own $vars are untouched.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's embedded DNS; re-resolve so an orchestrator restart (new IP) does not break the proxy.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $nexus_api ${NEXUS_API_UPSTREAM};

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API + SSE. No URI on proxy_pass, so /api/v1/... is forwarded unchanged.
    location /api/ {
        proxy_pass http://$nexus_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (GET .../events): stream every byte as it arrives, keep idle streams open.
        # (No add_header here, so the server-level security headers are inherited.)
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Fingerprinted build assets.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: client-side routes (/investigations/:id) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}

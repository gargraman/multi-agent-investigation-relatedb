[project]
name = "relate-spike"
version = "0.0.0"
description = "S0 technical spike: Relate embedded graph DB (ADR-001)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "relate-db==1.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pytest>=8",
    "psutil>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

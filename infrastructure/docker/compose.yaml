# Nexus core stack, `lite` profile (spec §16). No observability container here: the LGTM
# overlay (compose.observability.yaml) arrives in S6. Agents join in S2/S3.
#
#   make secrets && make up      # from the repo root
#
# Networks simulate the §14.2 segmentation on one host; they do not prove isolation.
name: nexus

x-python-build: &python-build
  context: ../..
  dockerfile: infrastructure/docker/python.Dockerfile

x-common-env: &common-env
  NEXUS_ENV: local
  NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  context-service:
    build:
      <<: *python-build
      args:
        PACKAGE: nexus-context-service
        MODULE: nexus_context_service
        WITH_RELATE_CLI: "true"
    image: nexus/context-service:dev
    environment:
      <<: *common-env
      SERVICE_NAME: context-service
      SERVICE_TOKEN: ${NEXUS_TOKEN_CONTEXT_SERVICE:?run make secrets}
      NEXUS_TOKEN_ORCHESTRATOR: ${NEXUS_TOKEN_ORCHESTRATOR:?run make secrets}
      RELATE_STORE_PATH: /data/relate
    volumes:
      - relate-store:/data          # only this service mounts the store (AC5)
    networks: [nexus-context]
    stop_grace_period: 20s          # finish in-flight tx, flush, close (§16.2)
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}

  orchestrator:
    build:
      <<: *python-build
      args:
        PACKAGE: nexus-orchestrator
        MODULE: nexus_orchestrator
    image: nexus/orchestrator:dev
    environment:
      <<: *common-env
      SERVICE_NAME: orchestrator
      SERVICE_TOKEN: ${NEXUS_TOKEN_ORCHESTRATOR:?run make secrets}
      CONTEXT_SERVICE_URL: http://context-service:8000
      SQLITE_PATH: /data/orchestrator.sqlite
      SCENARIOS_DIR: /app/data/scenarios
      # S1: nothing leaves CREATED until the workflow lands (S3), so the spec default of 2 would
      # block the third create. Restore the default of 2 in S3.
      NEXUS_MAX_CONCURRENT_INVESTIGATIONS: ${NEXUS_MAX_CONCURRENT_INVESTIGATIONS:-20}
    volumes:
      - orchestrator-state:/data
      - ../../data/scenarios:/app/data/scenarios:ro   # manifests only; never fixtures
    networks: [nexus-app, nexus-context]
    depends_on:
      context-service: {condition: service_healthy}
    stop_grace_period: 15s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512m}

  frontend:
    build:
      context: ../../apps/frontend
      # Extra CA bundle for TLS-intercepting proxies (build-time only, never in the image).
      # Defaults to an empty file, which the Dockerfile ignores.
      secrets: [npm_ca]
    image: nexus/frontend:dev
    ports:
      - "127.0.0.1:${NEXUS_UI_PORT:-3000}:8080"
    networks: [nexus-app]
    depends_on:
      orchestrator: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m}

secrets:
  npm_ca:
    file: ${NODE_EXTRA_CA_CERTS:-/dev/null}

networks:
  nexus-app: {}
  nexus-context: {internal: true}

volumes:
  relate-store: {}
  orchestrator-state: {}
